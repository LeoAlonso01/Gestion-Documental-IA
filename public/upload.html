<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload — Gestion Documental IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="mb-4">
    <nav class="site-nav navbar navbar-expand bg-white shadow-sm rounded p-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Gestion Documental IA</a>
        <div class="nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="upload.html">Upload</a>
          <a class="nav-link" href="docs.html">Documents</a>
          <a class="nav-link" href="about.html">About</a>
        </div>
        <div id="authArea" class="ms-3"></div>
      </div>
    </nav>
  </header>

  <main class="container mt-2">
    <h1>Upload Document</h1>
    <p>Select a file to upload your document.</p>

    <div class="file-upload">
      <label for="fileInput">Choose a document to upload</label>
      <input type="file" name="file" id="fileInput">
      <button type="button" class="btn btn-primary" id="uploadBtn">Upload Document</button>
    </div>

    <div class="dropzone mt-3" id="dropzone" role="button" tabindex="0" aria-label="Zona de archivo">
      <div class="drop-message">Arrastra tus archivos aquí, o haz clic para seleccionar</div>
      <div class="filename muted small" id="dropFilename" style="display:none"></div>
    </div>

    <div class="upload-status mt-3" id="uploadStatus" style="display: none;">
      <div class="d-flex align-items-center" style="gap:.6rem;">
        <div class="progress flex-grow-1" style="height: 25px;">
          <div class="progress-bar" role="progressbar" style="width: 0%;" id="progressBar">0%</div>
        </div>
        <div id="progressCount" class="small muted">0.0s</div>
        <button type="button" class="btn btn-ghost" id="cancelUpload" style="display:none">Cancel</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results mt-5 container" id="results" style="display:none">
      <div class="row">
        <div class="col-md-6">
          <h2>Upload Results</h2>
          <div id="resultContent"></div>
        </div>
        <div class="col-md-6">
          <h2>Acciones / Revisión</h2>
          <div class="d-flex flex-column align-items-start" style="gap:.6rem;">
            <button type="button" class="btn btn-primary" id="reviewBtn">Revisar con IA</button>
            <div id="botonResult" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="scripts.js?v=2"></script>
  <script>
    // Highlight nav active link
    (function(){
      const links=document.querySelectorAll('.site-nav .nav-link');
      links.forEach(a=>{ if(location.pathname.endsWith(a.getAttribute('href'))){ a.classList.add('active'); } });
    })();
  </script>
</body>
</html>
