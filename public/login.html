<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Gestion Documental IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="mb-4">
    <nav class="site-nav navbar navbar-expand bg-white shadow-sm rounded p-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Gestion Documental IA</a>
        <div class="nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="upload.html">Upload</a>
          <a class="nav-link" href="docs.html">Documents</a>
          <a class="nav-link" href="about.html">About</a>
        </div>
        <div id="authArea" class="ms-3"></div>
      </div>
    </nav>
  </header>

  <main class="container mt-2 auth-page">
    <div class="auth-card mx-auto">
      <h1 class="mb-3">Sign in</h1>

      <div id="authMessage" class="muted small mb-2" style="display:none"></div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required>
        <div class="d-flex" style="gap:.5rem;margin-top:.6rem">
          <button class="btn btn-primary" type="submit">Sign in</button>
          <button type="button" class="btn btn-ghost" id="showRegister">Register</button>
        </div>
      </form>

      <div class="divider muted small my-3">or</div>
      <button id="googleBtn" class="btn btn-primary" style="display:block">Sign in with Google</button>

      <hr>

      <form id="registerForm" style="display:none">
        <h2 class="mb-2">Create account</h2>
        <label for="regName">Name (optional)</label>
        <input id="regName" type="text">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" required>
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" required>
        <div class="d-flex" style="gap:.5rem;margin-top:.6rem">
          <button class="btn btn-primary" type="submit">Create account</button>
          <button type="button" class="btn btn-ghost" id="showLogin">Back</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="scripts.js?v=2"></script>
  <script>
    // small UI handling for the register/login toggle + clearer errors
    (function(){
      const showRegister = document.getElementById('showRegister');
      const showLogin = document.getElementById('showLogin');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const authMessage = document.getElementById('authMessage');
      function hideMessage(){ authMessage.style.display='none'; authMessage.className='muted small mb-2'; authMessage.textContent=''; }
      function showError(msg){ authMessage.style.display='block'; authMessage.className='text-danger small mb-2'; authMessage.textContent = msg; }
      function showSuccess(msg){ authMessage.style.display='block'; authMessage.className='text-success small mb-2'; authMessage.textContent = msg; }

      if(showRegister) showRegister.addEventListener('click', ()=>{ loginForm.style.display='none'; registerForm.style.display='block'; hideMessage(); });
      if(showLogin) showLogin.addEventListener('click', ()=>{ loginForm.style.display='block'; registerForm.style.display='none'; hideMessage(); });

      // Bind form submits to functions exposed on window.appAuth
      const login = document.getElementById('loginForm');
      if(login) login.addEventListener('submit', async (e)=>{
        e.preventDefault();
        hideMessage();
        const email=document.getElementById('loginEmail').value.trim();
        const pw=document.getElementById('loginPassword').value;
        const submitBtn = login.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        try{
          await window.appAuth.signInWithEmail(email,pw);
          showSuccess('Inicio de sesión correcto. Redirigiendo…');
        }catch(err){
          const msg = window.appAuth && window.appAuth.formatAuthError ? window.appAuth.formatAuthError(err) : (err.message || 'Inicio de sesión fallido');
          showError(msg);
        }finally{ if(submitBtn) submitBtn.disabled = false; }
      });

      const reg = document.getElementById('registerForm');
      if(reg) reg.addEventListener('submit', async (e)=>{
        e.preventDefault();
        hideMessage();
        const email=document.getElementById('regEmail').value.trim();
        const pw=document.getElementById('regPassword').value;
        const name=document.getElementById('regName').value.trim();
        const submitBtn = reg.querySelector('button[type="submit"]');
        if(submitBtn) submitBtn.disabled = true;
        try{
          await window.appAuth.registerWithEmail(email,pw,name);
          showSuccess('Cuenta creada correctamente. Redirigiendo…');
        }catch(err){
          const msg = window.appAuth && window.appAuth.formatAuthError ? window.appAuth.formatAuthError(err) : (err.message || 'Registro fallido');
          showError(msg);
        }finally{ if(submitBtn) submitBtn.disabled = false; }
      });

      const gbtn = document.getElementById('googleBtn');
      if(gbtn) gbtn.addEventListener('click', async ()=>{
        hideMessage();
        gbtn.disabled = true;
        try{
          await window.appAuth.loginWithGoogle();
          showSuccess('Inicio con Google correcto. Redirigiendo…');
        }catch(err){
          const msg = window.appAuth && window.appAuth.formatAuthError ? window.appAuth.formatAuthError(err) : (err.message || 'Inicio con Google fallido');
          showError(msg);
        }finally{ gbtn.disabled = false; }
      });
    })();
  </script>
</body>
</html>
